name: Generate Profile Image Assets

on:
  push:
    paths:
      - 'assets/Aditya.jpeg'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow opencv-python-headless

      - name: Generate Profile Graphics
        run: |
          python scripts/generate_profile_assets.py --input assets/Aditya.jpeg --outdir assets

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No changes in generated assets."
          else
            git commit -m "chore(assets): auto-regenerate profile graphics from code"
            git push
          fi
